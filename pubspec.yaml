name: unlockable_avatar_maker
description: A light-weight and highly customizable SVG avatar library for
  Flutter apps. Provides a Customizer Widget, CircleAvatar and other utility
  functions that are ready-to-use.
version: 1.0.0
# author: Suraj Kumar
homepage: https://github.com/lcossu/unlockable_avatar_maker

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: '>=3.3.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.4
  get: ^4.6.5
  shared_preferences: ^2.0.20
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - attributeicons/
